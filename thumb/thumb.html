<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Thumb Podcast Kitcar</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@800;900&display=swap" rel="stylesheet">
<style>
  /* Thumb 1280x720. Para usar a foto real: salve como lucas.png (fundo recortado) nesta pasta. */
  :root { --navy:#0B1630; --navy2:#16274A; --cyan:#00B1E2; --blue:#0060AB; --red:#E8262B; --yellow:#FFD400; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1280px; height:720px; overflow:hidden; background:var(--navy); }
  .t { position:relative; width:1280px; height:720px; overflow:hidden;
       background:
         radial-gradient(ellipse 620px 520px at 26% 60%, rgba(0,177,226,.55), transparent 70%),
         linear-gradient(115deg, var(--navy) 0%, var(--navy2) 55%, #06101f 100%); }
  /* faixas diagonais da marca */
  .stripe { position:absolute; top:-120px; width:70px; height:1000px; background:var(--cyan); transform:rotate(18deg); opacity:.18; }
  .s1 { left:520px; } .s2 { left:610px; opacity:.1; }

  /* foto */
  .photo { position:absolute; left:0; bottom:0; width:600px; height:720px; display:flex; align-items:flex-end; justify-content:center; }
  .photo img { height:700px; filter: drop-shadow(0 0 0 #fff) drop-shadow(0 20px 40px rgba(0,0,0,.6)); }
  .ph { width:470px; height:640px; border:4px dashed rgba(255,255,255,.45); border-bottom:none; border-radius:240px 240px 0 0;
        background:linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,.03));
        display:flex; align-items:center; justify-content:center; text-align:center;
        font:800 30px/1.25 Inter, sans-serif; color:rgba(255,255,255,.75); letter-spacing:.02em; }

  /* texto */
  .copy { position:absolute; right:56px; top:70px; width:640px; text-align:right; font-family:Anton, 'Inter', sans-serif; text-transform:uppercase; }
  .tag { display:inline-block; background:var(--red); color:#fff; font:900 34px/1 Inter, sans-serif; padding:14px 22px 12px; transform:rotate(-3deg);
         box-shadow:0 8px 24px rgba(0,0,0,.45); letter-spacing:.01em; }
  .l1 { margin-top:26px; font-size:118px; line-height:.95; color:#fff; text-shadow:0 6px 0 rgba(0,0,0,.35); }
  .l2 { font-size:184px; line-height:.9; color:var(--cyan); text-shadow:0 8px 0 #003a5e, 0 0 60px rgba(0,177,226,.5); letter-spacing:-.01em; }
  .l2 .a { font-size:120px; color:#fff; margin-right:18px; text-shadow:0 6px 0 rgba(0,0,0,.35); }
  .l2 small { text-transform:none;  font-size:110px; vertical-align:top; position:relative; top:12px; }
  .l3 { margin-top:14px; font-size:58px; line-height:1; color:var(--yellow); text-shadow:0 5px 0 rgba(0,0,0,.4); }
  .arrow { color:var(--yellow); }

  .logo { position:absolute; right:56px; bottom:40px; height:44px; opacity:.95; }
  .guest { position:absolute; left:40px; bottom:40px; background:#fff; color:var(--navy); font:900 30px/1 Inter, sans-serif; padding:12px 20px; border-left:10px solid var(--cyan); }
  .guest span { color:var(--blue); }
  .v-b, .v-a { display:none; }
  body.a .v-a, body.b .v-b { display:block; }
</style>
</head>
<body class="a">
<div class="t">
  <div class="stripe s1"></div><div class="stripe s2"></div>

  <div class="photo">
    <img src="lucas.png" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'ph',innerHTML:'FOTO DO LUCAS<br>(recortada, expressão forte)'}))">
  </div>

  <!-- Variante A: virada de chave -->
  <div class="copy v-a">
    <div class="tag">FALIU E FICOU SEM NOME</div>
    <div class="l1">De falido</div>
    <div class="l2"><span class="a">a</span>3.500<small>m²</small></div>
    <div class="l3">de loja de carros</div>
  </div>

  <!-- Variante B: origem -->
  <div class="copy v-b">
    <div class="tag">COMEÇOU AOS 10 ANOS</div>
    <div class="l1">Vendia peixe</div>
    <div class="l2" style="font-size:150px">Hoje tem</div>
    <div class="l3" style="font-size:84px">3 empresas</div>
  </div>

  <div class="guest">LUCAS <span>· KITCAR</span></div>
  <img class="logo" src="logo-the-seller.png" alt="">
</div>
<script>
  const v = new URLSearchParams(location.search).get('v');
  if (v) document.body.className = v;
</script>
</body>
</html>
