<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Thumb Podcast Quitcar</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&display=swap" rel="stylesheet">
<style>
  /* Thumb 1280x720, estilo premium: fundo escuro, foto low-key à direita, texto branco + pílula azul. */
  :root { --bg:#0c0e11; --blue:#1F6BE0; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1280px; height:720px; overflow:hidden; background:var(--bg); }
  .t { position:relative; width:1280px; height:720px; overflow:hidden;
       background:
         radial-gradient(ellipse 560px 460px at 78% 42%, rgba(70,90,120,.38), transparent 70%),
         radial-gradient(ellipse 900px 700px at 30% 50%, #15181d, var(--bg) 75%); }

  .photo { position:absolute; right:-150px; bottom:0; width:920px; }
  .photo img { display:block; width:100%;
    filter: grayscale(.45) contrast(1.12) brightness(.82) saturate(.9);
    -webkit-mask-image:
      linear-gradient(180deg, #000 70%, transparent 100%),
      linear-gradient(90deg, transparent 0%, #000 14%);
    -webkit-mask-composite: source-in; mask-composite: intersect;
    mask-image:
      linear-gradient(180deg, #000 70%, transparent 100%),
      linear-gradient(90deg, transparent 0%, #000 14%); }
  /* escurece levemente a borda da foto para o texto respirar */
  .shade { position:absolute; inset:0; background:linear-gradient(90deg, rgba(12,14,17,.9) 0%, rgba(12,14,17,.5) 42%, transparent 52%); pointer-events:none; }

  .copy { position:absolute; left:56px; top:50%; transform:translateY(-50%); font-family:Montserrat, sans-serif; text-transform:uppercase; }
  .kicker { font-weight:800; font-size:20px; letter-spacing:.32em; color:rgba(255,255,255,.55); margin-bottom:22px; }
  .big { font-weight:900; font-size:76px; line-height:.98; color:#fff; letter-spacing:-.015em; text-shadow:0 4px 30px rgba(0,0,0,.6); }
  .pill { display:inline-block; margin-top:20px; background:var(--blue); color:#fff; font-weight:900; font-size:38px; line-height:1;
          padding:14px 26px 15px; border-radius:16px; letter-spacing:-.005em; box-shadow:0 10px 30px rgba(31,107,224,.35); }
  .v-a, .v-b { display:none; }
  body.a .v-a, body.b .v-b { display:block; }
</style>
</head>
<body class="a">
<div class="t">
  <div class="photo"><img src="grupo.png" alt=""></div>
  <div class="shade"></div>

  <div class="copy v-a">
    <div class="kicker">Lucas · Quitcar</div>
    <div class="big">De falido<br>a 3.500<span style="text-transform:none">m²</span></div>
    <div class="pill">de loja de carros</div>
  </div>

  <div class="copy v-b">
    <div class="kicker">Lucas · Quitcar</div>
    <div class="big">Vendia peixe<br>aos 10 anos,</div>
    <div class="pill">hoje tem 3 empresas</div>
  </div>
</div>
<script>
  const v = new URLSearchParams(location.search).get('v');
  if (v) document.body.className = v;
</script>
</body>
</html>
